[build]
  command = "pnpm install && pnpm run build:demo"
  publish = "packages/wiki-as-git-browser/demo"

# SPA: serve index.html for unmatched routes (e.g. /en.wikipedia.org/blob/master/Game Boy.wiki)
# Existing files (dist/bundle.js) are served as-is
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
